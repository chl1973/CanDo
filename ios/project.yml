# 用 XcodeGen 生成 Xcode 工程：brew install xcodegen && xcodegen generate
name: KeyanWorkbench
options:
  bundleIdPrefix: com.keyan
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: zh-Hans
settings:
  base:
    MARKETING_VERSION: "1.15.0"
    CURRENT_PROJECT_VERSION: "22"
    SWIFT_VERSION: "5.0"
targets:
  KeyanWorkbench:
    type: application
    platform: iOS
    sources:
      - path: KeyanWorkbench
    info:
      path: KeyanWorkbench/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyan.workbench
        PRODUCT_NAME: KeyanWorkbench
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # 在 Xcode 的 Signing & Capabilities 里选择你的 Team；也可以在这里填 DEVELOPMENT_TEAM
