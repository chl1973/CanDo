# 每次推送或提 PR 时自动跑后端测试（在 GitHub 的 Linux 机器上，不需要 API Key）
name: 测试
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 检查格式
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: 后端测试
        run: go test -race ./...
      - name: 能编译 Windows 程序
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/CanDo.exe .
